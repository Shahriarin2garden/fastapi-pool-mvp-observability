apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-api
  namespace: shop
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: order-api
  namespaceSelector:
    matchNames:
      - shop
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
